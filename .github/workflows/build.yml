name: Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-gates:
    runs-on: ubuntu-latest
    env:
      OMP_VERSION: v1.6.7.3218
    steps:
      - uses: actions/checkout@v4

      # Toolchain diambil dari paket resmi open.mp (berisi pawncc + include
      # `open.mp`), supaya CI memakai compiler & include yang sama dengan lokal.
      - name: Ambil toolchain open.mp
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/omp.tar.gz \
            "https://github.com/openmultiplayer/open.mp/releases/download/${OMP_VERSION}/open.mp-linux-x86.tar.gz"
          tar xzf /tmp/omp.tar.gz -C /tmp
          mkdir -p server
          cp -r /tmp/Server/qawno server/qawno
          chmod +x server/qawno/pawncc
          test -x server/qawno/pawncc
          export LD_LIBRARY_PATH="$PWD/server/qawno:${LD_LIBRARY_PATH:-}"
          server/qawno/pawncc -v || true

      # Satu gate tunggal: skrip yang sama dipakai developer secara lokal,
      # sehingga CI tidak pernah lebih longgar dari mesin sendiri.
      - name: Gate (grep + header + budget + compile)
        run: ./scripts/gates.sh
